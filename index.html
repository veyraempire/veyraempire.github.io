<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VEYRA EMPIRE</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://veyra-empire.github.io/scripts/">

  <!-- Fallback for anything that blocks the script below. A meta refresh
       cannot carry a query string or hash, which is why the script goes
       first and this only catches what it misses. -->
  <meta http-equiv="refresh" content="0; url=https://veyra-empire.github.io/scripts/">

  <style>
    /* The archive's own background, so passing through here does not flash
       white on the way across. */
    html { background: #0a0612; color: #f5e9d0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 0 16px; text-align: center;
    }
    a { color: #f2c072; }
  </style>
</head>
<body>
  <p>Taking you to the <a href="https://veyra-empire.github.io/scripts/">VEYRA EMPIRE archive</a>&hellip;</p>

  <script>
    // Absolute, because the archive lives on the hyphenated host - this one
    // holds nothing but these two files. Query and hash come along; replace()
    // keeps the hop out of history so Back does not bounce through here.
    location.replace('https://veyra-empire.github.io/scripts/' + location.search + location.hash);
  </script>
</body>
</html>
